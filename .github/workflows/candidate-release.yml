name: Windows candidate
on:
  workflow_dispatch:
    inputs:
      action:
        description: Build an artifact, or publish previously accepted bytes
        type: choice
        options: [build, publish, publish-preview, terminal-probe]
        default: build
      version:
        description: New immutable prerelease tag
        default: v0.2.1
      candidate_run_id:
        description: Successful build run ID (publish only)
      acceptance_path:
        description: Checked-in sanitized acceptance directory (publish only)
        default: integrations/acceptance/windows
permissions:
  contents: read
  actions: read
jobs:
  terminal-probe:
    if: inputs.action == 'terminal-probe'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: pwsh
        run: |
          npm install --prefix .ci/pty --no-audit --no-fund node-pty@1.1.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NODE_PTY_MODULE = "$PWD\.ci\pty\node_modules\node-pty"
          node integrations/tests/windows-terminal-probe.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-terminal-probe
          path: windows-terminal-probe.json
  build:
    if: inputs.action == 'build'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install protoc 29.3
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 -o protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive protoc.zip -DestinationPath .ci/protoc
          "PROTOC=$PWD\.ci\protoc\bin\protoc.exe" >> $env:GITHUB_ENV
          "PROTOC_INCLUDE=$PWD\.ci\protoc\include" >> $env:GITHUB_ENV
      - name: Fetch pinned Windows search dependency
        shell: pwsh
        run: |
          . ./integrations/windows-process.ps1
          . ./integrations/windows-ripgrep.ps1
          $archive = Get-WindowsRipgrepArchive
          "POLYCODE_RIPGREP_ARCHIVE=$archive" >> $env:GITHUB_ENV
      - name: Install bridge and terminal test dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts --prefix integrations/native-provider
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --prefix .ci/pty --no-audit --no-fund node-pty@1.1.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "NODE_PTY_MODULE=$PWD\.ci\pty\node_modules\node-pty" >> $env:GITHUB_ENV
      - name: Windows bridge and installer regression
        shell: pwsh
        run: |
          node --test integrations/native-provider/test/*.test.mjs integrations/native-provider/cursor/provider.test.mjs integrations/tests/install-native.test.mjs integrations/tests/install-authorization.test.mjs integrations/tests/release-readiness.test.mjs integrations/tests/candidate-readiness.test.mjs integrations/tests/windows-native-prompts.test.mjs integrations/tests/preview-readiness.test.mjs integrations/tests/install-preview.test.mjs integrations/tests/install-mainline.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun test integrations/native-provider/test integrations/native-provider/cursor/provider.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify Windows terminal transport before compiling
        shell: pwsh
        run: |
          node integrations/tests/windows-terminal-probe.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build actual release executable
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p xai-grok-pager-bin --bin xai-grok-pager -j2 --message-format=json-render-diagnostics > cargo-build.jsonl
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node integrations/build-report.mjs cargo-build.jsonl target/x86_64-pc-windows-msvc/release/xai-grok-pager.exe native-build.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native bridge unit regression
        shell: pwsh
        run: |
          cargo test --locked --release --target x86_64-pc-windows-msvc -p xai-grok-shell --lib polycode::tests:: -j2 -- --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --release --target x86_64-pc-windows-msvc -p xai-grok-shell --lib outbound_messages_preserve_partial_inbound_frames -j2 -- --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compaction and fast mode regression
        shell: pwsh
        run: |
          cargo test --locked --release --target x86_64-pc-windows-msvc -p xai-grok-shell --lib session_compact -j2 -- --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --release --target x86_64-pc-windows-msvc -p xai-grok-shell --lib fast -j2 -- --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package Windows candidate
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          ./integrations/package-release.ps1 -Binary "$PWD/target/x86_64-pc-windows-msvc/release/xai-grok-pager.exe" -Runtime (Get-Command bun.exe).Source -BuildReport "$PWD/native-build.json" -Output "$PWD/candidate-out" -Version $env:CANDIDATE_VERSION
      - name: Install and run candidate in a real Windows terminal
        shell: pwsh
        run: |
          node integrations/tests/windows-candidate-smoke.mjs candidate-out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $smoke = Get-Content windows-smoke-report.json -Raw | ConvertFrom-Json
          if (-not $smoke.passed -or -not $smoke.searchExecutable) { throw 'Installed search dependency was not verified.' }
          node integrations/tests/windows-native-tools.mjs target/x86_64-pc-windows-msvc/release/xai-grok-pager.exe --mcp --task --grep --clean-path --ripgrep $smoke.searchExecutable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item windows-tools-report.json windows-tools-node-report.json
          node integrations/tests/windows-native-tools.mjs target/x86_64-pc-windows-msvc/release/xai-grok-pager.exe --bun-bridge --slow-shell --mcp --task --grep --clean-path --ripgrep $smoke.searchExecutable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: polycode-windows-candidate
          path: candidate-out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-evidence
          path: |
            cargo-build.jsonl
            native-build.json
            windows-smoke-report.json
            windows-tools-report.json
            windows-tools-node-report.json
            windows-terminal-probe.json
            windows-smoke-terminal-*.json
  publish:
    if: inputs.action == 'publish'
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and verify previously accepted bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          ACCEPTANCE_PATH: ${{ inputs.acceptance_path }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:CANDIDATE_RUN -notmatch '^[0-9]+$') { throw 'An accepted build run ID is required.' }
          if ($env:CANDIDATE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid version.' }
          gh run download $env:CANDIDATE_RUN -n polycode-windows-candidate -D candidate-out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node integrations/candidate-readiness.mjs candidate-out $env:ACCEPTANCE_PATH $env:CANDIDATE_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish new prerelease without rebuilding or replacing assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          gh release view $env:CANDIDATE_VERSION *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Accepted assets are immutable.' }
          $assets = Get-ChildItem candidate-out -File | ForEach-Object FullName
          $manifest = Get-Content candidate-out/manifest.json -Raw | ConvertFrom-Json
          gh release create $env:CANDIDATE_VERSION @assets --target $manifest.native.revision --prerelease --title "Polycode $env:CANDIDATE_VERSION Windows candidate" --notes "Windows x64 native prerelease. Install the version-specific install.ps1 with -GitHubCandidate. No WSL required. This is not an authorized stable release."
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  publish-preview:
    if: inputs.action == 'publish-preview'
    runs-on: windows-2022
    timeout-minutes: 20
    concurrency:
      group: polycode-preview-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify separate Preview policy and publisher regression
        shell: pwsh
        run: |
          node --test integrations/tests/preview-readiness.test.mjs integrations/tests/candidate-readiness.test.mjs integrations/tests/release-readiness.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish only verified original bytes as non-Latest Preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          ACCEPTANCE_PATH: ${{ inputs.acceptance_path }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          POLICY_REVISION: ${{ github.sha }}
        run: |
          if ($env:CANDIDATE_RUN -notmatch '^[0-9]+$') { throw 'A successful build run ID is required.' }
          if ($env:CANDIDATE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid version.' }
          gh run download $env:CANDIDATE_RUN -n polycode-windows-candidate -D candidate-out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node integrations/publish-preview.mjs candidate-out $env:ACCEPTANCE_PATH $env:CANDIDATE_VERSION $env:CANDIDATE_RUN $env:GH_REPO $env:POLICY_REVISION preview-publication
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-publication-receipt
          path: |
            preview-publication/publication-receipt.json
            preview-publication/release-notes.md
